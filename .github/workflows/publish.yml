name: Publish Letterboxd feed

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Keep scheduled workflow active
        run: |
          now=$(date -u +%s)
          previous=0
          if [ -f .last_activity ]; then previous=$(cat .last_activity); fi
          if [ $((now - previous)) -ge 2592000 ]; then
            printf '%s\n' "$now" > .last_activity
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add .last_activity
            git commit -m 'Keep scheduled feed active'
            git push
          fi
      - uses: actions/configure-pages@v5
      - name: Generate feed
        env:
          PREVIOUS_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/feed.xml
        run: |
          python3 feed.py --after "$(cat cutoff.txt)" --previous-url "$PREVIOUS_URL" --output feed.xml
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
